<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全生产技术规范审计资料库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .qiangtiao { color: #ff4757; font-weight: bold; }
        .tech-panel { background: #050b14; border: 1px solid #1b2a47; }
    </style>
</head>
<body class="bg-[#050b14] text-gray-300 min-h-screen p-4">

    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-[#00e5ff] mb-6">安全生产技术规范审计系统</h1>
        
        <form id="auditForm" class="p-6 tech-panel border-t flex gap-4">
            <input type="text" id="query" class="flex-1 bg-transparent border border-[#1b2a47] p-4 text-white outline-none" placeholder="输入审计指令..." required>
            <button type="submit" class="px-6 py-4 border border-[#00e5ff] text-[#00e5ff] hover:bg-[#00e5ff] hover:text-[#050b14] transition-all">
                开始审计
            </button>
        </form>

        <div id="chatArea" class="mt-6 p-6 tech-panel min-h-[200px]">
            <div class="text-[#8a9bb2]">等待指令...</div>
        </div>
    </div>

    <script>
        document.getElementById('auditForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const query = document.getElementById('query').value;
            const chat = document.getElementById('chatArea');
            
            chat.innerHTML = '<div class="text-[#8a9bb2]">正在审计中，请稍候...</div>';

            try {
                const res = await fetch('/api/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: '0000', query: query })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error || "服务器内部错误");
                }
                
                if (data && data.result) {
                    const formattedResult = data.result.replace(/规范要求[（\(]强条[\)）]/g, '<strong class="qiangtiao">规范要求（强条）</strong>');
                    chat.innerHTML = marked.parse(formattedResult);
                } else {
                    chat.innerHTML = '<div class="text-yellow-500">后端返回数据为空。</div>';
                }
            } catch (err) {
                console.error(err);
                alert("审计失败: " + err.message);
                chat.innerHTML = '<div class="text-red-500">审计异常，请查看控制台报错。</div>';
            }
        });
    </script>
</body>
</html>
